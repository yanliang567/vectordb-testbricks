version: "2.6"
extends: schema_matrix_2_6.yaml

# A 3.0 target writes nested scalar index metadata for StructArray sub-fields.
# The 2.6 reader rejects that format (`is_nested=true`), so these two schemas
# are target-format-only in a 2.6 -> 3.0 -> 2.6 round trip. They remain in the
# full 2.6 matrix for upgrade and target-only coverage.
exclude_schemas:
  - struct_array_varchar_autoindex_rollback_safe
  - struct_array_numeric_autoindex_rollback_safe
