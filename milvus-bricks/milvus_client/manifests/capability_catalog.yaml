capabilities:
  - id: QueryAggregation
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "query_aggregation"
    unsupported_behavior: skip

  - id: OrderBy
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "order_by"
    unsupported_behavior: skip

  - id: NullableVector
    detect:
      server_version_min: "2.6.18"
      sdk_probe: "create_nullable_vector_schema"
    unsupported_behavior: skip

  - id: Geometry
    detect:
      server_version_min: "2.6.18"
      sdk_probe: "geometry_field"
    unsupported_behavior: skip

  - id: TimeSeries
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "timestamptz_field"
    unsupported_behavior: skip

  - id: EntityTTL
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "entity_ttl"
    unsupported_behavior: skip

  - id: StructArray
    detect:
      server_version_min: "2.6.18"
      sdk_probe: "struct_array_schema"
    unsupported_behavior: skip

  - id: StructArrayExtended
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "struct_array_extended_schema"
    unsupported_behavior: skip

  - id: ElementHybridSearch
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "element_hybrid_search"
    unsupported_behavior: skip

  - id: StorageV3
    detect:
      server_version_min: "3.0.0"
      config_probe: "common.storage.useLoonFFI"
    unsupported_behavior: skip
    requires_cluster_admin: true

  - id: FaissIndex
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "faiss_index"
    unsupported_behavior: skip

  - id: MinHash
    detect:
      server_version_min: "3.0.0"
      sdk_probe: "minhash_function"
    unsupported_behavior: skip

  - id: IndexEngineV10V4
    detect:
      server_version_min: "3.0.0"
      config_probe: "dataCoord.targetVecIndexVersion=10,dataCoord.targetScalarIndexVersion=4"
    unsupported_behavior: skip
    requires_cluster_admin: true

  - id: IndexEngineV11V4
    detect:
      server_version_min: "3.0.0"
      config_probe: "dataCoord.targetVecIndexVersion=11,dataCoord.targetScalarIndexVersion=4"
    unsupported_behavior: skip
    requires_cluster_admin: true
