version: "2"

defaults:
  repo_url: https://github.com/yanliang567/vectordb-testbricks.git
  repo_revision: main
  milvus_log_level: debug
  rows_per_collection: 5000
  batch_size: 100
  pressure_modules:
    - search_pressure
    - query_pressure
    - query_iterator_scan
    - count_pressure
    - upsert_pressure
    - delete_pressure
    - mixed_rw_pressure
  rollback_serviceability_timeout_sec: 900
  rollback_serviceability_interval_sec: 10
  index_compatibility_validation_enabled: true
  phase_dml_dql_validation_enabled: true
  phase_new_collection_rows: 3000
  phase_existing_dml_rows: 1000
  phase_existing_delete_rows: 100

workflow_templates:
  standalone_2_6: milvus-standalone-2-6-upgrade-rollback
  standalone_3_0: milvus-standalone-3-0-upgrade-rollback
  cluster: milvus-cluster-upgrade-rollback

deploy_profiles:
  standalone: milvus_client/manifests/deploy_profiles/standalone-rocksmq.yaml
  cluster_pulsar_1cu: milvus_client/manifests/deploy_profiles/cluster-pulsar-1cu.yaml
  cluster_woodpecker_1cu: milvus_client/manifests/deploy_profiles/cluster-woodpecker-1cu.yaml
  cluster_woodpecker_v0_1_38_1cu: milvus_client/manifests/deploy_profiles/cluster-woodpecker-v0-1-38-1cu.yaml
  cluster_woodpecker_2cu: milvus_client/manifests/deploy_profiles/cluster-woodpecker-2cu.yaml

schema_matrices:
  "2.6": milvus_client/manifests/schema_matrix_2_6.yaml
  rollback_safe_base: milvus_client/manifests/schema_matrix_2_6.yaml
  woodpecker_reader_recovery: milvus_client/manifests/schema_matrix_2_6_woodpecker_reader_recovery.yaml
  "3.0": milvus_client/manifests/schema_matrix_3_0.yaml
  3.0_storage_v3: milvus_client/manifests/schema_matrix_3_0_storage_v3.yaml
  3.0_index_v10_v4: milvus_client/manifests/schema_matrix_3_0_index_v10_v4.yaml
  3.0_index_v11_v4: milvus_client/manifests/schema_matrix_3_0_index_v11_v4.yaml
  json_shredding: milvus_client/manifests/schema_matrix_json_shredding.yaml

image_aliases:
  milvus-2-6-18:
    image: harbor.milvus.io/milvusdb/milvus:v2.6.18@sha256:c6e332d3783c2c42649d5f76c5dae79d553927196a60547f619be13484ab44f6
    version: "2.6.18"
  milvus-2-6-latest:
    image: harbor.milvus.io/milvusdb/milvus:2.6-latest-placeholder
    version: "2.6.0"
  milvus-3-0-baseline:
    image: harbor.milvus.io/milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862
    version: "3.0.0"
  milvus-3-0-vortex-candidate-baseline:
    image: harbor.milvus.io/milvusdb/milvus:3.0-20260807-697431f2@sha256:e29d3275d1184ecf5e00995dd8b2c234e6912ea3c899c6b9d6f8807f7d6db5a3
    version: "3.0.0"
    source_commit: 697431f2c36c146e5033c71de6b91133aedc8f4c
    milvus_storage_commit: 63c29c674bf8c75a84c49cca2c8ab088e771e57e
    vortex_compatibility: vortex-0.75+
  milvus-3-0-vortex-candidate-target:
    image: harbor.milvus.io/milvusdb/milvus:3.0-20260807-1439dc7d@sha256:ed46e16fcb58bd460722e6fc1c0e6294e86fd4e062431877d0a872dcb510cd64
    version: "3.0.0"
    source_commit: 1439dc7de8b198a01c2afa0ae20c0c473e0e1abc
    milvus_storage_commit: 63c29c674bf8c75a84c49cca2c8ab088e771e57e
    vortex_compatibility: vortex-0.75+
  milvus-3-0-latest:
    image: harbor.milvus.io/milvusdb/milvus:3.0-latest-placeholder
    version: "3.0.0"
  # TODO(release): placeholder pending the official v3.0.1 multi-arch
  # manifest-list digest. Every scenario referencing this alias is render-blocked
  # (validate_no_gate_placeholders) until the digest is pinned. These are all
  # positive gate scenarios: same-version LoonFFI/Vortex/JSON toggles are safe
  # under the 3.0.x dual reader; the only pre-release candidates are the
  # immutable Vortex 0.75 image aliases above.
  milvus-3-0-1:
    image: harbor.milvus.io/milvusdb/milvus:v3.0.1-placeholder
    version: "3.0.1"

# Round-trip contracts must reference an immutable base/rollback image recorded
# here with passed evidence for the scenario topology. A version number alone is
# never treated as proof of index-engine compatibility.
capability_qualifications: {}

scenarios:
  - id: standalone-2-6-18-to-3-0-latest-rollback-2-6-latest
    description: "Known limitation tracker for milvus-io/milvus#52893: the strict full 2.6 schema matrix reproduces nested scalar index rollback incompatibility in 2.6.18 to 3.0 latest then rollback to latest 2.6, so this scenario is not release-gate eligible."
    mode: standalone
    classification: known_limitation
    support_status: unsupported
    workflow_template_ref: standalone_2_6
    deploy_profile_ref: standalone
    # Keep both StructArray nested scalar AutoIndex schemas in this strict
    # matrix so a green run proves #52893 is fixed instead of hiding it.
    schema_matrix_ref: "2.6"
    collection_prefix: qa_gate_2618_to_30_rb_26latest
    forward_workload_enabled: false
    schema_evolution_existing_enabled: false
    schema_evolution_forward_enabled: false
    rollback_forward_validation_enabled: false
    base:
      image_ref: milvus-2-6-18
      json_shredding_enabled: false
      vortex_enabled: false
    target:
      image_ref: milvus-3-0-latest
      json_shredding_enabled: false
      loon_ffi_enabled: false
      vortex_enabled: false
    rollback:
      image_ref: milvus-2-6-latest
      json_shredding_enabled: false
      vortex_enabled: false
    validation_policy:
      data_integrity: strict
      serviceability: strict
      pressure_fail_on_error: true
      gate_allow_warning: false
    forbidden_after_upgrade:
      - storage_v3
      - vortex

  - id: standalone-2-6-18-to-3-0-latest-target-only-features-rollback-2-6-latest
    description: "Target-only feature gate: preserve rollback-safe 2.6 baseline data, create and validate 3.0-only forward collections after upgrade, then rollback to 2.6 without requiring those forward collections to remain readable."
    mode: standalone
    classification: gate
    support_status: supported_with_config_constraints
    workflow_template_ref: standalone_2_6
    deploy_profile_ref: standalone
    schema_matrix_ref: "2.6"
    forward_schema_matrix_ref: "3.0"
    collection_prefix: qa_gate_2618_to_30_target_only
    forward_workload_enabled: true
    schema_evolution_existing_enabled: false
    schema_evolution_forward_enabled: true
    rollback_forward_validation_enabled: false
    base:
      image_ref: milvus-2-6-18
      json_shredding_enabled: false
      vortex_enabled: false
    target:
      image_ref: milvus-3-0-latest
      json_shredding_enabled: false
      loon_ffi_enabled: false
      vortex_enabled: false
    rollback:
      image_ref: milvus-2-6-latest
      json_shredding_enabled: false
      vortex_enabled: false
    validation_policy:
      data_integrity: strict
      serviceability: strict
      pressure_fail_on_error: true
      gate_allow_warning: false
    forbidden_after_upgrade:
      - storage_v3
      - vortex

  - id: standalone-3-0-baseline-to-3-0-latest-rollback-3-0-baseline
    description: "3.0 branch gate: baseline to latest 3.0 and rollback to the same 3.0 baseline."
    mode: standalone
    classification: gate
    support_status: supported
    workflow_template_ref: standalone_3_0
    deploy_profile_ref: standalone
    schema_matrix_ref: "3.0"
    forward_schema_matrix_ref: "3.0"
    collection_prefix: qa_gate_30_to_30latest
    forward_workload_enabled: true
    schema_evolution_existing_enabled: true
    schema_evolution_forward_enabled: false
    rollback_forward_validation_enabled: true
    base:
      image_ref: milvus-3-0-baseline
      json_shredding_enabled: false
      vortex_enabled: false
    target:
      image_ref: milvus-3-0-latest
      json_shredding_enabled: false
      loon_ffi_enabled: false
      vortex_enabled: false
    rollback:
      image_ref: milvus-3-0-baseline
      json_shredding_enabled: false
      vortex_enabled: false
    validation_policy:
      data_integrity: strict
      serviceability: strict
      pressure_fail_on_error: true
      gate_allow_warning: false

  - id: standalone-3-0-vortex-candidate-upgrade-rollback
    description: "Pre-release candidate coverage for the v3.0.1 Vortex rollback contract: upgrade from an earlier reviewed 3.0 branch build to a newer reviewed build with LoonFFI/Vortex enabled, then rollback to the earlier build. Superseded by the milvus-3-0-1 gate scenarios once v3.0.1 ships; retire after the release rerun."
    mode: standalone
    classification: candidate
    support_status: pre_release_candidate
    workflow_template_ref: standalone_3_0
    deploy_profile_ref: standalone
    schema_matrix_ref: rollback_safe_base
    forward_schema_matrix_ref: 3.0_storage_v3
    collection_prefix: qa_gate_30_to_30latest_lv
    forward_workload_enabled: true
    schema_evolution_existing_enabled: false
    schema_evolution_forward_enabled: false
    rollback_forward_validation_enabled: true
    base:
      image_ref: milvus-3-0-vortex-candidate-baseline
      json_shredding_enabled: false
      vortex_enabled: false
    target:
      image_ref: milvus-3-0-vortex-candidate-target
      json_shredding_enabled: false
      loon_ffi_enabled: true
      vortex_enabled: true
    rollback:
      image_ref: milvus-3-0-vortex-candidate-baseline
      json_shredding_enabled: false
      loon_ffi_enabled: true
      vortex_enabled: true
    validation_policy:
      data_integrity: strict
      serviceability: strict
      pressure_fail_on_error: true
      gate_allow_warning: false

  - id: standalone-3-0-index-v10-v4-upgrade-rollback
    description: "3.0 index engine gate: keep v3.0.0 base/rollback on the rollback-safe matrix and validate vector/scalar target versions 10/4 only on the target build."
    mode: standalone
    classification: gate
    support_status: supported
    workflow_template_ref: standalone_3_0
    deploy_profile_ref: standalone
    index_engine_contract:
      mode: target_only
      capability: IndexEngineV10V4
      matrix_ref: 3.0_index_v10_v4
      rollback_safe_matrix_ref: rollback_safe_base
      vector_version: 10
      scalar_version: 4
      rationale:
        baseline_support: unsupported
        issue: https://github.com/milvus-io/milvus/issues/52767
    collection_prefix: qa_gate_30_index_v10_v4
    schema_evolution_existing_enabled: false
    schema_evolution_forward_enabled: false
    base:
      image_ref: milvus-3-0-baseline
    target:
      image_ref: milvus-3-0-latest
    rollback:
