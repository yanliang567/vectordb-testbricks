  - id: standalone-3-0-baseline-to-3-0-latest-json-shredding-rollback-3-0-baseline
    description: "3.0 JSON Shredding gate: enable JSON Shredding after upgrade, write dedicated JSON-heavy forward data, then rollback with JSON Shredding enabled and validate that data. Known limitation: rollback to v3.0.0 fails for struct-array HYBRID scalar indexes (milvus-io/milvus#52768), so this scenario is not release-gate eligible."
    mode: standalone
    classification: known_limitation
