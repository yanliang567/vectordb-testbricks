version: "1"

defaults:
  repo_url: https://github.com/yanliang567/vectordb-testbricks.git
  repo_revision: main
  rows_per_collection: 5000
  batch_size: 100
  pressure_modules:
    - search_pressure
    - query_pressure
    - query_iterator_scan
    - count_pressure
    - upsert_pressure
    - delete_pressure
    - mixed_rw_pressure
  rollback_serviceability_timeout_sec: 900
  rollback_serviceability_interval_sec: 10
  index_compatibility_validation_enabled: true
  phase_dml_dql_validation_enabled: true
  phase_new_collection_rows: 3000
  phase_existing_dml_rows: 1000
  phase_existing_delete_rows: 100

workflow_templates:
  standalone_2_6: milvus-standalone-2-6-upgrade-rollback
  standalone_3_0: milvus-standalone-3-0-upgrade-rollback
  cluster: milvus-cluster-upgrade-rollback

deploy_profiles:
  standalone: milvus_client/manifests/deploy_profiles/standalone-rocksmq.yaml
  cluster_pulsar_1cu: milvus_client/manifests/deploy_profiles/cluster-pulsar-1cu.yaml
  cluster_woodpecker_1cu: milvus_client/manifests/deploy_profiles/cluster-woodpecker-1cu.yaml
  cluster_woodpecker_2cu: milvus_client/manifests/deploy_profiles/cluster-woodpecker-2cu.yaml

schema_matrices:
  "2.6": milvus_client/manifests/schema_matrix_2_6.yaml
  rollback_safe_base: milvus_client/manifests/schema_matrix_2_6.yaml
  "3.0": milvus_client/manifests/schema_matrix_3_0.yaml
  3.0_storage_v3: milvus_client/manifests/schema_matrix_3_0_storage_v3.yaml
  3.0_index_v10_v4: milvus_client/manifests/schema_matrix_3_0_index_v10_v4.yaml
  json_shredding: milvus_client/manifests/schema_matrix_json_shredding.yaml

image_aliases:
  milvus-2-6-18:
    image: harbor.milvus.io/milvusdb/milvus:v2.6.18@sha256:c6e332d3783c2c42649d5f76c5dae79d553927196a60547f619be13484ab44f6
    version: "2.6.18"
  milvus-2-6-latest:
    image: harbor.milvus.io/milvusdb/milvus:2.6-latest-placeholder
    version: "2.6.0"
  milvus-3-0-baseline:
