    version: "3.0.0"
  milvus-3-0-vortex-candidate-baseline:
    image: harbor.milvus.io/milvusdb/milvus:3.0-20260807-697431f2@sha256:e29d3275d1184ecf5e00995dd8b2c234e6912ea3c899c6b9d6f8807f7d6db5a3
    version: "3.0.0"
