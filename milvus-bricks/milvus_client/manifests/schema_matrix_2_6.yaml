version: "2.6"
schemas:
  - name: scalar_dynamic_partition_key
    description: "2.6 scalar, array, dynamic field, partition-key, and scalar-index coverage"
    feature_tags: ["compat_basic_vector", "compat_json_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: []
    validators: ["count", "pk_sample", "search_smoke"]
    enable_dynamic_field: true
    num_partitions: 16
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: partition_key, dtype: VARCHAR, max_length: 64, is_partition_key: true}
      - {name: int8_bitmap, dtype: INT8}
      - {name: int16_inverted, dtype: INT16}
      - {name: int32_sort, dtype: INT32}
      - {name: int64_category, dtype: INT64}
      - {name: float_sort, dtype: FLOAT}
      - {name: double_inverted, dtype: DOUBLE}
      - {name: bool_bitmap, dtype: BOOL, nullable: true}
      - {name: varchar_trie, dtype: VARCHAR, max_length: 256}
      - {name: varchar_ngram, dtype: VARCHAR, max_length: 256}
      - {name: nullable_text, dtype: VARCHAR, max_length: 1024, nullable: true}
      - {name: json_profile, dtype: JSON, nullable: true}
      - {name: arr_int64, dtype: ARRAY, element_type: INT64, max_capacity: 16}
      - {name: arr_float, dtype: ARRAY, element_type: FLOAT, max_capacity: 16}
      - {name: arr_bool, dtype: ARRAY, element_type: BOOL, max_capacity: 16}
      - {name: arr_varchar, dtype: ARRAY, element_type: VARCHAR, max_capacity: 16, max_length: 128}
      - {name: embedding, dtype: FLOAT_VECTOR, dim: 128}
    indexes:
      - {field: int8_bitmap, index_type: BITMAP}
      - {field: int16_inverted, index_type: INVERTED}
      - {field: int32_sort, index_type: STL_SORT}
      - {field: int64_category, index_type: AUTOINDEX}
      - {field: float_sort, index_type: STL_SORT}
      - {field: double_inverted, index_type: INVERTED}
      - {field: bool_bitmap, index_type: BITMAP}
      - {field: varchar_trie, index_type: TRIE}
      - {field: varchar_ngram, index_type: NGRAM, params: {min_gram: 2, max_gram: 4}}
      - {field: json_profile, index_type: INVERTED, params: {json_cast_type: double, json_path: "json_profile['bucket']"}}
      - {field: arr_int64, index_type: INVERTED}
      - {field: arr_varchar, index_type: INVERTED}
      - {field: embedding, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}}

  - name: scalar_autoindex_formats_rollback_safe
    description: "2.6 primitive, JSON path, and ARRAY AutoIndex persisted-format coverage"
    feature_tags: ["compat_basic_vector", "compat_json_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: []
    validators: ["count", "pk_sample", "search_smoke"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: int64_auto, dtype: INT64}
      - {name: float_auto, dtype: FLOAT}
      - {name: bool_auto, dtype: BOOL}
      - {name: varchar_auto, dtype: VARCHAR, max_length: 256}
      - {name: json_auto, dtype: JSON}
      - {name: json_bool, dtype: JSON}
      - {name: json_varchar, dtype: JSON}
      - {name: arr_int64_auto, dtype: ARRAY, element_type: INT64, max_capacity: 16}
      - {name: arr_float_auto, dtype: ARRAY, element_type: FLOAT, max_capacity: 16}
      - {name: arr_bool_auto, dtype: ARRAY, element_type: BOOL, max_capacity: 16}
      - {name: arr_varchar_auto, dtype: ARRAY, element_type: VARCHAR, max_capacity: 16, max_length: 128}
      - {name: embedding, dtype: FLOAT_VECTOR, dim: 64}
    indexes:
      - {field: int64_auto, index_type: AUTOINDEX}
      - {field: float_auto, index_type: AUTOINDEX}
      - {field: bool_auto, index_type: AUTOINDEX}
      - {field: varchar_auto, index_type: AUTOINDEX}
      - {field: json_auto, index_type: AUTOINDEX, params: {json_cast_type: double, json_path: "json_auto['bucket']"}}
      - {field: json_bool, index_type: AUTOINDEX, params: {json_cast_type: bool, json_path: "json_bool['active']"}}
      - {field: json_varchar, index_type: AUTOINDEX, params: {json_cast_type: varchar, json_path: "json_varchar['label']"}}
      - {field: arr_int64_auto, index_type: AUTOINDEX}
      - {field: arr_float_auto, index_type: AUTOINDEX}
      - {field: arr_bool_auto, index_type: AUTOINDEX}
      - {field: arr_varchar_auto, index_type: AUTOINDEX}
      - {field: embedding, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}

  - name: scalar_explicit_index_formats_rollback_safe
    description: "2.6 unpartitioned primitive, JSON path, and ARRAY explicit persisted-index format coverage"
    feature_tags: ["compat_basic_vector", "compat_json_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: []
    validators: ["count", "pk_sample", "search_smoke"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: int8_bitmap, dtype: INT8}
      - {name: int16_inverted, dtype: INT16}
      - {name: int32_sort, dtype: INT32}
      - {name: float_sort, dtype: FLOAT}
      - {name: double_inverted, dtype: DOUBLE}
      - {name: bool_bitmap, dtype: BOOL, nullable: true}
      - {name: varchar_trie, dtype: VARCHAR, max_length: 256}
      - {name: varchar_ngram, dtype: VARCHAR, max_length: 256}
      - {name: json_profile, dtype: JSON, nullable: true}
      - {name: arr_int64, dtype: ARRAY, element_type: INT64, max_capacity: 16}
      - {name: arr_varchar, dtype: ARRAY, element_type: VARCHAR, max_capacity: 16, max_length: 128}
      - {name: embedding, dtype: FLOAT_VECTOR, dim: 64}
    indexes:
      - {field: int8_bitmap, index_type: BITMAP}
      - {field: int16_inverted, index_type: INVERTED}
      - {field: int32_sort, index_type: STL_SORT}
      - {field: float_sort, index_type: STL_SORT}
      - {field: double_inverted, index_type: INVERTED}
      - {field: bool_bitmap, index_type: BITMAP}
      - {field: varchar_trie, index_type: TRIE}
      - {field: varchar_ngram, index_type: NGRAM, params: {min_gram: 2, max_gram: 4}}
      - {field: json_profile, index_type: INVERTED, params: {json_cast_type: double, json_path: "json_profile['bucket']"}}
      - {field: arr_int64, index_type: INVERTED}
      - {field: arr_varchar, index_type: INVERTED}
      - {field: embedding, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}

  - name: vector_autoid_bm25
    description: "2.6 auto-id, BM25 function, all vector data types, and vector-index coverage"
    feature_tags: ["compat_basic_vector", "compat_multi_vector"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: []
    validators: ["count", "pk_sample", "search_smoke"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: true}
      - {name: category, dtype: INT64}
      - {name: document, dtype: VARCHAR, max_length: 2048, enable_analyzer: true, analyzer_params: {type: standard}}
      - {name: dense_hnsw, dtype: FLOAT_VECTOR, dim: 128}
      - {name: dense_rabitq, dtype: FLOAT_VECTOR, dim: 128}
      - {name: dense_diskann, dtype: FLOAT_VECTOR, dim: 128}
      - {name: dense_autoindex, dtype: FLOAT_VECTOR, dim: 128}
      - {name: float16_hnsw, dtype: FLOAT16_VECTOR, dim: 128}
      - {name: bfloat16_diskann, dtype: BFLOAT16_VECTOR, dim: 128}
      - {name: int8_autoindex, dtype: INT8_VECTOR, dim: 128}
      - {name: binary_ivf, dtype: BINARY_VECTOR, dim: 128}
      - {name: sparse_manual, dtype: SPARSE_FLOAT_VECTOR}
      - {name: sparse_bm25, dtype: SPARSE_FLOAT_VECTOR}
    functions:
      - name: bm25_document
        function_type: BM25
        input_fields: [document]
        output_fields: [sparse_bm25]
    indexes:
      - {field: category, index_type: INVERTED}
      - {field: dense_hnsw, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}}
      - {field: dense_rabitq, index_type: IVF_RABITQ, metric_type: COSINE, params: {nlist: 128}}
      - {field: dense_diskann, index_type: DISKANN, metric_type: L2, params: {search_list_size: 100}}
      - {field: dense_autoindex, index_type: AUTOINDEX, metric_type: COSINE}
      - {field: float16_hnsw, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}}
      - {field: bfloat16_diskann, index_type: DISKANN, metric_type: COSINE, params: {search_list_size: 100}}
      - {field: int8_autoindex, index_type: AUTOINDEX, metric_type: COSINE}
      - {field: binary_ivf, index_type: BIN_IVF_FLAT, metric_type: HAMMING, params: {nlist: 128}}
      - {field: sparse_manual, index_type: SPARSE_INVERTED_INDEX, metric_type: IP, params: {drop_ratio_build: 0.0}}
      - {field: sparse_bm25, index_type: SPARSE_INVERTED_INDEX, metric_type: BM25, params: {drop_ratio_build: 0.0}}

  - name: explicit_partitions_nullable
    description: "2.6 explicit multi-partition, varchar primary key, and nullable scalar coverage"
    feature_tags: ["compat_basic_vector", "compat_json_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: []
    validators: ["count", "pk_sample", "search_smoke"]
    partitions: ["p0", "p1", "p2", "p3"]
    fields:
      - {name: pk, dtype: VARCHAR, primary: true, auto_id: false, max_length: 64}
      - {name: tenant, dtype: VARCHAR, max_length: 64}
      - {name: category, dtype: INT64}
      - {name: nullable_score, dtype: DOUBLE, nullable: true}
      - {name: nullable_flag, dtype: BOOL, nullable: true}
      - {name: nullable_json, dtype: JSON, nullable: true}
      - {name: tags, dtype: ARRAY, element_type: VARCHAR, max_capacity: 32, max_length: 128}
      - {name: embedding_hnsw, dtype: FLOAT_VECTOR, dim: 128}
    indexes:
      - {field: tenant, index_type: INVERTED}
      - {field: category, index_type: STL_SORT}
      - {field: nullable_flag, index_type: BITMAP}
      - {field: tags, index_type: INVERTED}
      - {field: embedding_hnsw, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}}

  - name: struct_array_element_rollback_safe
    description: "2.6 StructArray scalar round-trip and element-level vector search coverage"
    feature_tags: ["struct_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: ["StructArray"]
    validators:
      - count
      - pk_sample
      - struct_array_scalar_round_trip
      - struct_array_element_search
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: normal_vector, dtype: FLOAT_VECTOR, dim: 64}
    struct_arrays:
      - name: items
        max_capacity: 8
        fields:
          - {name: embedding, dtype: FLOAT_VECTOR, dim: 64}
          - {name: score, dtype: FLOAT}
          - {name: category, dtype: VARCHAR, max_length: 128}
          - {name: rank, dtype: INT64}
          - {name: enabled, dtype: BOOL}
    indexes:
      - {field: normal_vector, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}
      - {field: "items[embedding]", index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}

  - name: struct_array_varchar_autoindex_rollback_safe
    description: "2.6 StructArray VARCHAR AutoIndex persisted-format reproducer for Milvus #52359"
    feature_tags: ["struct_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: ["StructArray"]
    validators:
      - count
      - pk_sample
      - search_smoke
      - struct_array_scalar_round_trip
      - struct_array_scalar_index_queries
    validator_params: {min_struct_scalar_index_queries: 1}
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: normal_vector, dtype: FLOAT_VECTOR, dim: 64}
    struct_arrays:
      - name: items
        max_capacity: 8
        fields:
          - {name: category, dtype: VARCHAR, max_length: 128}
    indexes:
      - {field: normal_vector, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}
      - {field: "items[category]", index_type: AUTOINDEX}

  - name: struct_array_numeric_autoindex_rollback_safe
    description: "2.6 StructArray FLOAT, INT64, and BOOL AutoIndex persisted-format coverage"
    feature_tags: ["struct_array"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: ["StructArray"]
    validators:
      - count
      - pk_sample
      - search_smoke
      - struct_array_scalar_round_trip
      - struct_array_scalar_index_queries
    validator_params: {min_struct_scalar_index_queries: 3}
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: normal_vector, dtype: FLOAT_VECTOR, dim: 64}
    struct_arrays:
      - name: items
        max_capacity: 8
        fields:
          - {name: score, dtype: FLOAT}
          - {name: rank, dtype: INT64}
          - {name: enabled, dtype: BOOL}
    indexes:
      - {field: normal_vector, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}
      - {field: "items[score]", index_type: AUTOINDEX}
      - {field: "items[rank]", index_type: AUTOINDEX}
      - {field: "items[enabled]", index_type: AUTOINDEX}

  - name: nullable_vectors_all
    description: "All six nullable vector data types available in Milvus 2.6.18"
    feature_tags: ["nullable_vector"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: ["NullableVector"]
    validators: ["count", "pk_sample", "nullable_vector_semantics"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: nullable_float, dtype: FLOAT_VECTOR, dim: 64, nullable: true}
      - {name: nullable_float16, dtype: FLOAT16_VECTOR, dim: 64, nullable: true}
      - {name: nullable_bfloat16, dtype: BFLOAT16_VECTOR, dim: 64, nullable: true}
      - {name: nullable_int8, dtype: INT8_VECTOR, dim: 64, nullable: true}
      - {name: nullable_binary, dtype: BINARY_VECTOR, dim: 64, nullable: true}
      - {name: nullable_sparse, dtype: SPARSE_FLOAT_VECTOR, nullable: true}
    indexes:
      - {field: nullable_float, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}
      - {field: nullable_float16, index_type: HNSW_SQ, metric_type: COSINE, params: {M: 8, efConstruction: 64, sq_type: SQ8}, search_params: {ef: 32}}
      - {field: nullable_bfloat16, index_type: DISKANN, metric_type: L2, params: {search_list_size: 64}, search_params: {search_list_size: 64}}
      - {field: nullable_int8, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}
      - {field: nullable_binary, index_type: BIN_FLAT, metric_type: HAMMING}
      - {field: nullable_sparse, index_type: SPARSE_WAND, metric_type: IP, params: {drop_ratio_build: 0.0}, search_params: {drop_ratio_search: 0.0}}

  - name: geometry_rtree_rollback_safe
    description: "Geometry RTREE metadata and spatial predicate rollback coverage"
    feature_tags: ["geometry"]
    compat_mode: rollback_safe
    shards_num: 1
    required_capabilities: ["Geometry"]
    validators: ["count", "pk_sample", "geometry_filter"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: location, dtype: GEOMETRY}
      - {name: embedding, dtype: FLOAT_VECTOR, dim: 64}
    indexes:
      - {field: location, index_type: RTREE}
      - {field: embedding, index_type: HNSW, metric_type: COSINE, params: {M: 8, efConstruction: 64}, search_params: {ef: 32}}

  - name: legacy_index_rollback_safe
    description: "Explicit legacy dense, binary, sparse, and scalar index families"
    feature_tags: ["compat_multi_vector"]
    compat_mode: rollback_safe
    shards_num: 1
    validators: ["count", "pk_sample", "search_smoke"]
    fields:
      - {name: id, dtype: INT64, primary: true, auto_id: false}
      - {name: flat_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: ivf_flat_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: ivf_sq8_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: ivf_pq_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: scann_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: hnsw_sq_vector, dtype: FLOAT_VECTOR, dim: 64}
      - {name: binary_flat, dtype: BINARY_VECTOR, dim: 64}
      - {name: sparse_wand, dtype: SPARSE_FLOAT_VECTOR}
    indexes:
      - {field: flat_vector, index_type: FLAT, metric_type: L2}
      - {field: ivf_flat_vector, index_type: IVF_FLAT, metric_type: L2, params: {nlist: 32}, search_params: {nprobe: 8}}
      - {field: ivf_sq8_vector, index_type: IVF_SQ8, metric_type: L2, params: {nlist: 32}, search_params: {nprobe: 8}}
      - {field: ivf_pq_vector, index_type: IVF_PQ, metric_type: L2, params: {nlist: 32, m: 8, nbits: 8}, search_params: {nprobe: 8}}
      - {field: scann_vector, index_type: SCANN, metric_type: L2, params: {nlist: 32}, search_params: {nprobe: 8, reorder_k: 32}}
      - {field: hnsw_sq_vector, index_type: HNSW_SQ, metric_type: COSINE, params: {M: 8, efConstruction: 64, sq_type: SQ8}, search_params: {ef: 32}}
      - {field: binary_flat, index_type: BIN_FLAT, metric_type: HAMMING}
      - {field: sparse_wand, index_type: SPARSE_WAND, metric_type: IP, params: {drop_ratio_build: 0.0}, search_params: {drop_ratio_search: 0.0}}
