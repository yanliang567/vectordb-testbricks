name: Milvus Bricks

on:
  pull_request:
    paths:
      - ".github/workflows/milvus-bricks.yml"
      - "milvus-bricks/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/milvus-bricks.yml"
      - "milvus-bricks/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml numpy pymilvus==3.0.1 ruff==0.15.22

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Argo CLI
        run: |
          curl -fsSL https://github.com/argoproj/argo-workflows/releases/download/v4.0.5/argo-linux-amd64.gz -o /tmp/argo.gz
          gunzip /tmp/argo.gz
          sudo install /tmp/argo /usr/local/bin/argo
          argo version --short

      - name: Argo lint
        run: argo lint --offline milvus-bricks/argo

      - name: Run tests
        working-directory: milvus-bricks
        run: PYTHONPATH=. python -m pytest milvus_client/tests -q

      - name: Ruff check
        working-directory: milvus-bricks
        run: |
          ruff check \
            milvus_client/common/data.py \
            milvus_client/common/deploy.py \
            milvus_client/common/feature_validators.py \
            milvus_client/common/gates.py \
            milvus_client/common/schema.py \
            milvus_client/common/workload.py \
            milvus_client/requests/generate_workflow_report.py \
            milvus_client/requests/render_milvus_cr.py \
            milvus_client/requests/render_milvus_helm_values.py \
            milvus_client/requests/validate_index_compatibility.py \
            milvus_client/requests/validate_schema_features.py \
            milvus_client/tests/test_data_generation.py \
            milvus_client/tests/test_feature_validators.py \
            milvus_client/tests/test_generate_workflow_report.py \
            milvus_client/tests/test_render_milvus_cr.py \
            milvus_client/tests/test_argo_template.py \
            milvus_client/tests/test_schema_manifest.py \
            milvus_client/tests/test_upgrade_rollback_gates_manifest.py \
            milvus_client/tests/test_validate_index_compatibility.py \
            milvus_client/tests/test_validate_schema_features.py \
            milvus_client/tests/test_workload.py

      - name: Ruff format check
        working-directory: milvus-bricks
        run: |
          ruff format --check \
            milvus_client/common/data.py \
            milvus_client/common/deploy.py \
            milvus_client/common/feature_validators.py \
            milvus_client/common/gates.py \
            milvus_client/common/schema.py \
            milvus_client/common/workload.py \
            milvus_client/requests/generate_workflow_report.py \
            milvus_client/requests/render_milvus_cr.py \
            milvus_client/requests/render_milvus_helm_values.py \
            milvus_client/requests/validate_index_compatibility.py \
            milvus_client/requests/validate_schema_features.py \
            milvus_client/tests/test_data_generation.py \
            milvus_client/tests/test_feature_validators.py \
            milvus_client/tests/test_generate_workflow_report.py \
            milvus_client/tests/test_render_milvus_cr.py \
            milvus_client/tests/test_argo_template.py \
            milvus_client/tests/test_schema_manifest.py \
            milvus_client/tests/test_upgrade_rollback_gates_manifest.py \
            milvus_client/tests/test_validate_index_compatibility.py \
            milvus_client/tests/test_validate_schema_features.py \
            milvus_client/tests/test_workload.py
